<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boom Drinks - Sistema POS & Informe INSAB (Archivo Único Autónomo)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @media print {
      @page { size: letter portrait; margin: 12mm 14mm 14mm 14mm; }
      body { background-color: #ffffff !important; color: #0f172a !important; font-size: 9.5pt !important; line-height: 1.35 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      header, footer, nav, button, .print-hidden { display: none !important; }
      main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; width: 100% !important; }
      .print-avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; }
      table { page-break-inside: avoid !important; break-inside: avoid !important; border-collapse: collapse !important; width: 100% !important; font-size: 8.5pt !important; }
      th, td { border-color: #cbd5e1 !important; padding: 4px 6px !important; }
      th { background-color: #f1f5f9 !important; color: #0f172a !important; font-weight: bold !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // Redondeo comercial al múltiplo de $0.05 / $0.25 hacia arriba
    const roundCommercial = (val) => Math.ceil(val * 20) / 20;

    const INITIAL_PRODUCTS = [
      { id: 'blue-sharks', name: 'Blue Sharks', description: 'Bebida refrescante azul océano con gomita de tiburón, jarabe cítrico, soda y hielo frappé.', price: 2.50, type: 'drink', color: 'from-blue-500 to-cyan-500', badge: 'Bebida Estrella 🦈' },
      { id: 'la-toxica', name: 'La Tóxica', description: 'Bebida frutal exótica con escarchado especial picosito de chamoy, tajín y gomitas ácidas.', price: 2.00, type: 'drink', color: 'from-emerald-500 to-lime-500', badge: 'Especial Picosito 🧪' },
      { id: 'duo-letal', name: 'Dúo Letal', description: 'Combo promocional: 1 Blue Shark + 1 La Tóxica. ¡Precio especial en pareja!', price: 4.00, type: 'combo', color: 'from-purple-600 to-indigo-600', badge: 'Combo $4.00 ⚡' },
      { id: 'doble-peligro', name: 'Doble Peligro', description: 'Mega Combo: 2 Blue Sharks + 2 La Tóxica para compartir.', price: 7.50, type: 'combo', color: 'from-rose-600 to-amber-600', badge: 'Mega Combo 🔥' }
    ];

    const COUPONS = [
      { id: 'none', label: 'Sin Cupón (0%)', percent: 0 },
      { id: 'percent_10', label: 'Cupón 10%', percent: 10 },
      { id: 'percent_15', label: 'Cupón 15%', percent: 15 },
      { id: 'percent_20', label: 'Cupón 20%', percent: 20 }
    ];

    const INITIAL_PARTNERS = [
      { id: '1', name: 'Raquel Henríquez', role: 'Gerente General', capitalContributed: 20.00 },
      { id: '2', name: 'Emily Rolin', role: 'Jefa de Producción', capitalContributed: 20.00 },
      { id: '3', name: 'Ashlie Aguilar', role: 'Auxiliar de Producción', capitalContributed: 20.00 },
      { id: '4', name: 'Williams Portillo', role: 'Encargado de Logística', capitalContributed: 20.00 },
      { id: '5', name: 'Gabriela Ferrufino', role: 'Responsable Financiera y Administrativa', capitalContributed: 20.00 },
      { id: '6', name: 'Alexandra Vázquez', role: 'Encargada de Marketing y Community Manager', capitalContributed: 20.00 },
      { id: '7', name: 'Jefferson Martinez', role: 'Auxiliar de Producción', capitalContributed: 20.00 }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('pos');
      const [cart, setCart] = useState([]);
      const [activeCoupon, setActiveCoupon] = useState('none');
      const [orders, setOrders] = useState(() => {
        try { return JSON.parse(localStorage.getItem('boom_orders') || '[]'); } catch { return []; }
      });
      const [expenses, setExpenses] = useState(() => {
        try { return JSON.parse(localStorage.getItem('boom_expenses') || '[]'); } catch { return []; }
      });
      const [losses, setLosses] = useState(() => {
        try { return JSON.parse(localStorage.getItem('boom_losses') || '[]'); } catch { return []; }
      });
      const [production, setProduction] = useState({
        plannedBlueSharks: 50, plannedLaToxica: 50, manualDamagedBlueSharks: 0, manualDamagedLaToxica: 0,
        explanation: 'Planificados: 50 unidades de Blue Sharks y 50 de La Tóxica. Elaboración bajo demanda en la feria.'
      });
      const [metadata, setMetadata] = useState({
        businessName: 'Boom Drinks',
        productName: 'Blue Sharks y La Tóxica (Bebidas Temáticas Refrescantes)',
        schoolName: 'INSTITUTO NACIONAL DE SAN BARTOLO – INSAB',
        moduleName: 'MÓDULO 3.7: PUESTA EN MARCHA DE LA MICROEMPRESA COOPERATIVA',
        eventName: 'FERIA DE EMPRENDIMIENTO',
        teacherName: 'Profesora Ángela Marisol Osegueda',
        fairDate: '24 de Octubre de 2026',
        productionPhone: '',
        customLogoUrl: 'logo.jpg',
        slogan: '¡Sabor explosivo que despierta tus sentidos!',
        mission: 'Ofrecer bebidas artesanales refrescantes de alta calidad bajo principios de trabajo cooperativo y servicio cordial.',
        vision: 'Ser la microempresa escolar referente en innovación y rentabilidad transparente en el INSAB.',
        mainLossCause: 'Ninguna merma crítica reportada al momento.',
        howToAvoidLosses: 'Control estricto de temperaturas de hielo y montaje ordenado de vasos con dosificadores.',
        teamConclusion: 'La microempresa escolar Boom Drinks superó las metas comerciales en la feria escolar INSAB. Gracias a Blue Sharks, La Tóxica y los combos, recuperamos el 100% de la inversión de $140.00 de los 7 socios y distribuimos dividendos equitativos.'
      });

      const [selectedOrder, setSelectedOrder] = useState(null);
      const [customerName, setCustomerName] = useState('');
      const [cashInput, setCashInput] = useState('');

      useEffect(() => {
        localStorage.setItem('boom_orders', JSON.stringify(orders));
        localStorage.setItem('boom_expenses', JSON.stringify(expenses));
        localStorage.setItem('boom_losses', JSON.stringify(losses));
      }, [orders, expenses, losses]);

      // Cálculos
      let totalSales = 0, blueSharksSold = 0, laToxicaSold = 0, duoLetalSold = 0, doblePeligroSold = 0, totalUnits = 0;
      orders.forEach(o => {
        totalSales += o.total;
        o.items.forEach(i => {
          totalUnits += i.quantity;
          if (i.id === 'blue-sharks') blueSharksSold += i.quantity;
          else if (i.id === 'la-toxica') laToxicaSold += i.quantity;
          else if (i.id === 'duo-letal') duoLetalSold += i.quantity;
          else if (i.id === 'doble-peligro') doblePeligroSold += i.quantity;
        });
      });

      const equivBlue = blueSharksSold + duoLetalSold * 1 + doblePeligroSold * 2;
      const equivToxica = laToxicaSold + duoLetalSold * 1 + doblePeligroSold * 2;
      const totalCosts = expenses.reduce((s, e) => s + e.amount, 0);
      const initialCapital = 140.00;
      const netProfit = totalSales - totalCosts;
      const capitalRecovered = Math.min(initialCapital, totalSales);
      const capitalPending = Math.max(0, initialCapital - totalSales);
      const isRecovered = totalSales >= initialCapital;
      const profitPerPartner = netProfit > 0 ? netProfit / 7 : 0;
      const payoutPerPartner = (capitalRecovered / 7) + profitPerPartner;

      // Acciones de Carrito
      const addToCart = (prod) => {
        setCart(prev => {
          const ex = prev.find(i => i.product.id === prod.id);
          if (ex) return prev.map(i => i.product.id === prod.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { product: prod, quantity: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => {
          if (i.product.id === id) {
            const n = i.quantity + delta;
            return n > 0 ? { ...i, quantity: n } : null;
          }
          return i;
        }).filter(Boolean));
      };

      // Cálculos Carrito
      const couponObj = COUPONS.find(c => c.id === activeCoupon) || COUPONS[0];
      let cartSubtotal = 0, cartDiscount = 0;
      cart.forEach(item => {
        const itemSub = item.product.price * item.quantity;
        cartSubtotal += itemSub;
        if (item.product.type !== 'combo' && couponObj.percent > 0) {
          cartDiscount += (itemSub * couponObj.percent) / 100;
        }
      });
      const unrounded = Math.max(0, cartSubtotal - cartDiscount);
      const finalTotal = roundCommercial(unrounded);
      const cashVal = parseFloat(cashInput) || 0;
      const changeVal = cashVal >= finalTotal ? cashVal - finalTotal : 0;

      const handleCheckout = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const effCash = cashVal > 0 ? cashVal : finalTotal;
        const newOrder = {
          id: 'ord-' + Date.now(),
          orderNumber: orders.length + 1,
          timestamp: new Date().toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' }),
          customerName: customerName || ('Cliente #' + (orders.length + 1)),
          items: cart.map(i => ({ id: i.product.id, name: i.product.name, price: i.product.price, quantity: i.quantity })),
          rawSubtotal: cartSubtotal,
          discount: cartDiscount,
          total: finalTotal,
          cashReceived: effCash,
          cashChange: effCash - finalTotal
        };

        setOrders([newOrder, ...orders]);
        setCart([]);
        setCashInput('');
        setCustomerName('');
        setSelectedOrder(newOrder);

        if (metadata.productionPhone) {
          const raw = metadata.productionPhone.replace(/[^0-9]/g, '');
          const phone = raw.length === 8 ? '503' + raw : raw;
          const msg = `🚨 *PEDIDO A PRODUCCIÓN - BOOM DRINKS*\n*Ticket:* #${newOrder.orderNumber}\n*Cliente:* ${newOrder.customerName}\n${newOrder.items.map(i => `➡️ *${i.quantity}x ${i.name}*`).join('\n')}\n¡Preparar de inmediato! 🦈🧪`;
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        try { confetti({ particleCount: 40, spread: 60 }); } catch (err) {}
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 print-hidden shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="h-10 w-10 rounded-2xl bg-cyan-600 flex items-center justify-center text-white text-xl font-black shadow-md">💥</div>
                <div>
                  <h1 className="font-black text-lg text-slate-900 leading-tight uppercase">BOOM DRINKS</h1>
                  <p className="text-[11px] text-slate-500">Módulo 3.7 • 7 Socios Cooperativistas • INSAB</p>
                </div>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">Ventas: <strong className="text-cyan-700 font-mono">${totalSales.toFixed(2)}</strong></span>
                <span className="bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">Ganancia: <strong className={netProfit >= 0 ? "text-emerald-700 font-mono" : "text-rose-700 font-mono"}>${netProfit.toFixed(2)}</strong></span>
                <button onClick={() => { if(confirm('¿Reiniciar todas las ventas a 0 para la feria en vivo?')) { setOrders([]); setCart([]); } }} className="text-[11px] px-2 py-1 bg-slate-100 hover:bg-slate-200 border rounded-lg text-slate-600 font-semibold">Reiniciar</button>
              </div>
            </div>
            {/* Navegación */}
            <div className="max-w-7xl mx-auto px-4 border-t border-slate-100 overflow-x-auto no-scrollbar">
              <nav className="flex space-x-1 py-1.5 min-w-max text-xs font-bold">
                {[
                  { id: 'pos', label: '🛒 Caja POS' },
                  { id: 'sales', label: `📑 Ventas (${orders.length})` },
                  { id: 'production', label: '🏭 Producción & Mermas' },
                  { id: 'finances', label: '💼 Finanzas & 7 Socios' },
                  { id: 'report', label: '📜 Informe INSAB Oficial', hl: true }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl transition ${activeTab === tab.id ? (tab.hl ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-white') : 'text-slate-600 hover:bg-slate-100'}`}>
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Contenido Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 print:p-0">
            {/* PESTAÑA: POS */}
            {activeTab === 'pos' && (
              <div className="space-y-6">
                {isRecovered && (
                  <div className="bg-emerald-600 text-white p-4 rounded-2xl shadow-lg flex items-center justify-between border-2 border-emerald-300">
                    <div>
                      <h3 className="font-black text-sm uppercase">¡ALERTA: CAPITAL RECUPERADO AL 100%! ($140.00) 🎉</h3>
                      <p className="text-xs text-emerald-100">Los 7 socios han recuperado su inversión inicial de $20.00 cada uno.</p>
                    </div>
                    <span className="text-xl font-black font-mono">${totalSales.toFixed(2)}</span>
                  </div>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Catálogo */}
                  <div className="lg:col-span-2 space-y-4">
                    <h2 className="text-sm font-extrabold uppercase text-slate-800">Catálogo de Bebidas & Combos</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {INITIAL_PRODUCTS.map(p => (
                        <div key={p.id} onClick={() => addToCart(p)} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs hover:border-cyan-500 cursor-pointer transition flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between items-start mb-1">
                              <h3 className="font-bold text-sm text-slate-900">{p.name}</h3>
                              <span className="text-xs px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-800">{p.badge}</span>
                            </div>
                            <p className="text-xs text-slate-500">{p.description}</p>
                          </div>
                          <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                            <span className="font-black text-base font-mono text-cyan-800">${p.price.toFixed(2)}</span>
                            <span className="text-xs bg-cyan-50 text-cyan-700 px-2.5 py-1 rounded-lg font-bold">+ Agregar</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* WhatsApp de Producción */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between gap-3 text-xs">
                      <div className="flex items-center gap-2">
                        <span className="text-base">👨‍🍳</span>
                        <div>
                          <strong>WhatsApp de Cocina / Producción:</strong>
                          <p className="text-[11px] text-slate-500">Se abrirá el mensaje de la orden automáticamente al cobrar.</p>
                        </div>
                      </div>
                      <input type="text" placeholder="Ej: 70000000" value={metadata.productionPhone} onChange={e => setMetadata({...metadata, productionPhone: e.target.value})} className="p-2 border rounded-xl font-mono text-xs w-36 bg-slate-50 text-center font-bold" />
                    </div>
                  </div>

                  {/* Carrito & Cobro */}
                  <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4 flex flex-col h-fit">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h3 className="font-extrabold text-sm uppercase">Orden Actual ({cart.reduce((s,i)=>s+i.quantity,0)})</h3>
                      {cart.length > 0 && <button onClick={() => setCart([])} className="text-rose-600 text-xs font-bold">Vaciar</button>}
                    </div>

                    {cart.length === 0 ? (
                      <p className="text-xs text-slate-400 py-6 text-center">Toca un producto para agregarlo a la orden.</p>
                    ) : (
                      <div className="space-y-2 max-h-56 overflow-y-auto">
                        {cart.map(item => (
                          <div key={item.product.id} className="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-xl">
                            <div>
                              <span className="font-bold block">{item.product.name}</span>
                              <span className="text-[10px] text-slate-500 font-mono">${item.product.price.toFixed(2)} c/u</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => updateQty(item.product.id, -1)} className="w-6 h-6 bg-slate-200 rounded-lg font-bold">-</button>
                              <span className="font-mono font-bold w-4 text-center">{item.quantity}</span>
                              <button onClick={() => updateQty(item.product.id, 1)} className="w-6 h-6 bg-slate-200 rounded-lg font-bold">+</button>
                              <span className="font-mono font-bold w-12 text-right">${(item.product.price * item.quantity).toFixed(2)}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Cupones */}
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Cupón de Descuento (Bebidas Individuales):</label>
                      <div className="grid grid-cols-2 gap-1 text-[11px]">
                        {COUPONS.map(c => (
                          <button key={c.id} onClick={() => setActiveCoupon(c.id)} className={`p-1.5 rounded-lg font-bold border transition ${activeCoupon === c.id ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                            {c.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Totales */}
                    <div className="border-t pt-2 space-y-1 text-xs">
                      <div className="flex justify-between text-slate-600"><span>Subtotal:</span><span className="font-mono">${cartSubtotal.toFixed(2)}</span></div>
                      {cartDiscount > 0 && <div className="flex justify-between text-emerald-600 font-semibold"><span>Descuento ({couponObj.label}):</span><span className="font-mono">-${cartDiscount.toFixed(2)}</span></div>}
                      <div className="flex justify-between font-black text-base border-t pt-1 text-slate-900">
                        <span>TOTAL A COBRAR:</span>
                        <span className="font-mono text-cyan-800">${finalTotal.toFixed(2)}</span>
                      </div>
                    </div>

                    {/* Cobro en Efectivo */}
                    <form onSubmit={handleCheckout} className="space-y-2 pt-2 border-t">
                      <input type="text" placeholder="Nombre cliente / Aula (opcional)" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-xl text-xs" />
                      <div>
                        <div className="flex justify-between text-[11px] mb-1 font-semibold text-slate-600">
                          <span>Efectivo Recibido ($):</span>
                          <span>Billetes Rápidos:</span>
                        </div>
                        <div className="flex gap-1 mb-1">
                          {[finalTotal, 5, 10, 20].map((b, idx) => (
                            <button key={idx} type="button" onClick={() => setCashInput(String(b))} className="flex-1 py-1 bg-slate-100 hover:bg-slate-200 rounded text-[11px] font-bold font-mono">
                              ${b.toFixed(2)}
                            </button>
                          ))}
                        </div>
                        <input type="number" step="0.25" placeholder={`$${finalTotal.toFixed(2)}`} value={cashInput} onChange={e => setCashInput(e.target.value)} className="w-full p-2 border rounded-xl text-sm font-mono font-bold text-center" />
                      </div>
                      {cashVal >= finalTotal && cashVal > 0 && (
                        <div className="p-2 bg-emerald-50 border border-emerald-200 rounded-xl text-center text-xs text-emerald-800 font-bold">
                          Cambio a Devolver: <span className="font-mono text-base font-black">${changeVal.toFixed(2)}</span>
                        </div>
                      )}
                      <button type="submit" disabled={cart.length === 0} className="w-full py-3 bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 text-white rounded-xl font-bold text-sm shadow-md transition">
                        Cobrar en Efectivo 💵
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* PESTAÑA: INFORME INSAB OFICIAL */}
            {activeTab === 'report' && (
              <div className="space-y-6">
                <div className="bg-white p-4 rounded-3xl border flex flex-wrap items-center justify-between gap-3 print-hidden">
                  <div>
                    <h2 className="font-black text-sm">Informe Final de Evaluación INSAB (Módulo 3.7)</h2>
                    <p className="text-xs text-slate-500">Documento completo con las 18 secciones oficiales y firmas de los 7 socios.</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-bold shadow-sm">
                      🖨️ Imprimir / Guardar PDF
                    </button>
                  </div>
                </div>

                {/* Hoja Formal del Informe */}
                <div className="bg-white p-8 md:p-12 rounded-3xl border shadow-sm space-y-6 text-xs print:p-0 print:border-none">
                  {/* Encabezado */}
                  <div className="text-center space-y-1 border-b-2 border-slate-300 pb-4 print-avoid-break">
                    <h1 className="text-base font-bold uppercase">{metadata.schoolName}</h1>
                    <h2 className="text-xs font-semibold text-slate-700 uppercase">{metadata.moduleName}</h2>
                    <h3 className="text-xs font-bold text-cyan-800 uppercase tracking-widest">{metadata.eventName}</h3>
                    <p className="text-sm font-black pt-1">INFORME FINAL DE EVALUACIÓN Y CIERRE DEL PROYECTO</p>
                    <p className="italic text-slate-500 text-[11px]">"DE LA IDEA A LA PUESTA EN MARCHA Y EVALUACIÓN DE LOS RESULTADOS"</p>
                  </div>

                  {/* Portada */}
                  <div className="bg-slate-50 p-4 rounded-xl border space-y-2 print-avoid-break">
                    <strong className="block text-slate-900 border-b pb-1 uppercase font-bold">I. DATOS GENERALES DEL PROYECTO (PORTADA)</strong>
                    <div className="grid grid-cols-2 gap-2">
                      <div><strong>Negocio:</strong> {metadata.businessName}</div>
                      <div><strong>Slogan:</strong> "{metadata.slogan}"</div>
                      <div><strong>Productos:</strong> {metadata.productName}</div>
                      <div><strong>Docente:</strong> {metadata.teacherName}</div>
                      <div><strong>Fecha de Feria:</strong> {metadata.fairDate}</div>
                      <div><strong>Capital Total:</strong> $140.00 (7 socios x $20.00)</div>
                    </div>
                  </div>

                  {/* Producción */}
                  <div className="space-y-2 print-avoid-break">
                    <strong className="block text-slate-900 uppercase font-bold">III. RESULTADOS DE PRODUCCIÓN</strong>
                    <table className="w-full border text-xs">
                      <thead className="bg-slate-100 font-bold">
                        <tr><th className="p-2 border">CONCEPTO</th><th className="p-2 border text-center">Blue Sharks</th><th className="p-2 border text-center">La Tóxica</th><th className="p-2 border text-center">TOTAL</th></tr>
                      </thead>
                      <tbody>
                        <tr><td className="p-1.5 border">Planificados</td><td className="p-1.5 border text-center font-mono">50</td><td className="p-1.5 border text-center font-mono">50</td><td className="p-1.5 border text-center font-mono font-bold">100</td></tr>
                        <tr className="bg-emerald-50"><td className="p-1.5 border font-bold">Elaborados (en ventas)</td><td className="p-1.5 border text-center font-mono font-bold">{equivBlue}</td><td className="p-1.5 border text-center font-mono font-bold">{equivToxica}</td><td className="p-1.5 border text-center font-mono font-bold">{equivBlue + equivToxica}</td></tr>
                        <tr><td className="p-1.5 border font-bold">Vendidos (Total equivalente)</td><td className="p-1.5 border text-center font-mono">{equivBlue}</td><td className="p-1.5 border text-center font-mono">{equivToxica}</td><td className="p-1.5 border text-center font-mono font-bold">{equivBlue + equivToxica}</td></tr>
                        <tr><td className="p-1.5 border text-rose-700">Dañados / Mermas</td><td className="p-1.5 border text-center font-mono text-rose-700">0</td><td className="p-1.5 border text-center font-mono text-rose-700">0</td><td className="p-1.5 border text-center font-mono font-bold text-rose-700">0</td></tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Ventas */}
                  <div className="space-y-2 print-avoid-break">
                    <strong className="block text-slate-900 uppercase font-bold">IV. RESULTADOS DE VENTAS</strong>
                    <table className="w-full border text-xs">
                      <thead className="bg-slate-100 font-bold">
                        <tr><th className="p-2 border">PRODUCTO</th><th className="p-2 border text-center">PRECIO</th><th className="p-2 border text-center">CANTIDAD</th><th className="p-2 border text-right">TOTAL</th></tr>
                      </thead>
                      <tbody>
                        <tr><td className="p-1.5 border">Blue Sharks</td><td className="p-1.5 border text-center font-mono">$2.50</td><td className="p-1.5 border text-center font-mono">{blueSharksSold}</td><td className="p-1.5 border text-right font-mono">${(blueSharksSold * 2.50).toFixed(2)}</td></tr>
                        <tr><td className="p-1.5 border">La Tóxica</td><td className="p-1.5 border text-center font-mono">$2.00</td><td className="p-1.5 border text-center font-mono">{laToxicaSold}</td><td className="p-1.5 border text-right font-mono">${(laToxicaSold * 2.00).toFixed(2)}</td></tr>
                        <tr><td className="p-1.5 border">Dúo Letal (Combo)</td><td className="p-1.5 border text-center font-mono">$4.00</td><td className="p-1.5 border text-center font-mono">{duoLetalSold}</td><td className="p-1.5 border text-right font-mono">${(duoLetalSold * 4.00).toFixed(2)}</td></tr>
                        <tr><td className="p-1.5 border">Doble Peligro (Mega Combo)</td><td className="p-1.5 border text-center font-mono">$7.50</td><td className="p-1.5 border text-center font-mono">{doblePeligroSold}</td><td className="p-1.5 border text-right font-mono">${(doblePeligroSold * 7.50).toFixed(2)}</td></tr>
                        <tr className="bg-slate-100 font-bold"><td colSpan="2" className="p-2 border">TOTALES:</td><td className="p-2 border text-center font-mono">{totalUnits}</td><td className="p-2 border text-right font-mono text-cyan-800">${totalSales.toFixed(2)}</td></tr>
                      </tbody>
                    </table>
                  </div>

                  {/* Resultado Económico */}
                  <div className="space-y-2 print-avoid-break">
                    <strong className="block text-slate-900 uppercase font-bold">VI & VII. RESULTADO ECONÓMICO Y RECUPERACIÓN DE CAPITAL</strong>
                    <div className="p-3 bg-emerald-50 border border-emerald-300 rounded-xl text-center space-y-1 font-semibold">
                      <div className="text-xs uppercase font-bold text-emerald-900">GANANCIA = VENTAS – COSTOS</div>
                      <div className="text-sm font-black font-mono">${totalSales.toFixed(2)} – ${totalCosts.toFixed(2)} = ${netProfit.toFixed(2)}</div>
                      <div className="text-[11px] text-emerald-800 font-bold">Estado del Capital: {isRecovered ? "☑ Recuperado al 100%" : "Parcialmente recuperado"}</div>
                    </div>
                  </div>

                  {/* 7 Socios */}
                  <div className="space-y-2 print-avoid-break">
                    <strong className="block text-slate-900 uppercase font-bold">VIII & XVII. DISTRIBUCIÓN Y FIRMAS DE LOS 7 SOCIOS COOPERATIVISTAS</strong>
                    <table className="w-full border text-xs">
                      <thead className="bg-slate-100 font-bold">
                        <tr><th className="p-1.5 border text-center">N.º</th><th className="p-1.5 border">NOMBRE</th><th className="p-1.5 border">ROL</th><th className="p-1.5 border text-right">APORTE</th><th className="p-1.5 border text-right">GANANCIA</th><th className="p-1.5 border text-right">TOTAL</th><th className="p-1.5 border text-center">FIRMA</th></tr>
                      </thead>
                      <tbody>
                        {INITIAL_PARTNERS.map((p, idx) => (
                          <tr key={p.id}>
                            <td className="p-1.5 border text-center font-mono">{idx + 1}</td>
                            <td className="p-1.5 border font-bold">{p.name}</td>
                            <td className="p-1.5 border text-slate-600">{p.role}</td>
                            <td className="p-1.5 border text-right font-mono">$20.00</td>
                            <td className="p-1.5 border text-right font-mono text-emerald-700">${profitPerPartner.toFixed(2)}</td>
                            <td className="p-1.5 border text-right font-mono font-bold">${payoutPerPartner.toFixed(2)}</td>
                            <td className="p-1.5 border text-center text-slate-400 font-serif italic">________________</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Cierre XVIII */}
                  <div className="p-4 bg-slate-900 text-white rounded-2xl text-xs space-y-1 print-avoid-break">
                    <div className="font-bold text-center border-b border-slate-700 pb-1 uppercase">XVIII. RESULTADO FINAL DEL NEGOCIO</div>
                    <div className="grid grid-cols-2 gap-2 pt-1 font-mono">
                      <div>CAPITAL INVERTIDO: $140.00</div>
                      <div className="text-right text-cyan-400">TOTAL VENDIDO: ${totalSales.toFixed(2)}</div>
                      <div>COSTOS TOTALES: ${totalCosts.toFixed(2)}</div>
                      <div className="text-right text-emerald-400">GANANCIA NETA: ${netProfit.toFixed(2)}</div>
                    </div>
                    <div className="text-center pt-2 font-bold text-emerald-400 border-t border-slate-700 mt-2">
                      TOTAL RECIBIDO POR CADA UNO DE LOS 7 SOCIOS: ${payoutPerPartner.toFixed(2)}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
